<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      background: #0078ff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #005fd1;
    }

    #content {
      display: none;
      text-align: left;
      width: 80%;
      max-width: 800px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    a {
      color: #00d4ff;
    }
  </style>
</head>
<body>

  <div class="box" id="loginBox">
    <h2>Welc0m3 t0 th3 adm1n p0rta1</h2>
    <input type="password" id="passwordInput" placeholder="Password..." />
    <button onclick="checkPassword()">Unlock</button>
    <p id="errorMsg" style="color:red; margin-top:10px;"></p>
  </div>

  <div id="content">
    <h1>W3lc0me t0 th3 adm1n p0rtal</h1>
    <p>Y0u n0w hav3 acc3ss t0 adm1n d1r3ct0rys</p>

    <h3>Links</h3>
    <ul>
      <li><a href="index.html" target="_blank">Go Home</a></li>
      <li><a href="sims/Windows 8 Interactive Demo.html" target="_blank">Win 8 Demo</a></li>
      <li><a href="sims/Ragdoll Archers.html" target="_blank">Ragdoll Archers</a></li>
      <li><a href="sims/Minecraft 1.12.2.html" target="_blank">Minecraft</a></li>
    </ul>

    <p>COngrats 0n g3tting th3 passw0rd!</p>
  </div>

  <script>
    const correctPassword = "BluG64L"; // <-- CHANGE THIS PASSWORD

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorMsg = document.getElementById("errorMsg");

      if (input === correctPassword) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("content").style.display = "block";
      } else {
        errorMsg.textContent = "Incorrect password. Try again.";
      }
    }

    // Allow Enter key to submit
    document.getElementById("passwordInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
