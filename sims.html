<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Portal | Fishix Simulators</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      background: #0078ff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #005fd1;
    }

    #adminContent, #friendContent {
      display: none;
      text-align: left;
      width: 80%;
      max-width: 800px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    a {
      color: #00d4ff;
    }
  </style>
</head>
<body>

  <!-- LOGIN BOX -->
  <div class="box" id="loginBox">
    <h2>Login Portal</h2>

    <input type="text" id="usernameInput" placeholder="Username..." />
    <input type="password" id="passwordInput" placeholder="Password..." />

    <button onclick="login()">Login</button>
    <p id="errorMsg" style="color:red; margin-top:10px;"></p>
  </div>


  <!-- ADMIN SECTION -->
  <div id="adminContent">
    <h1>Admin Section</h1>
    <p>Welcome, Kaiju</p>

    <h3>Admin Links</h3>
    <ul>
      <li><a href="index.html" target="_blank">Go Home</a></li>
      <li><a href="sims/Ragdoll Archers.html" target="_blank">Ragdoll Archers</a></li>
      <li><a href="sims/Minecraft 1.12.2.html" target="_blank">Minecraft</a></li>
    </ul>

    <button onclick="logout()">Logout</button>
  </div>


  <!-- FRIEND SECTION -->
  <div id="friendContent">
    <h1>Other Users</h1>
    <p>Welcome, Other Users</p>

    <h3>Other user | Links</h3>
    <ul>
      <li><a href="index.html" target="_blank">Go Home</a></li>
      <li><a href="sims/Minecraft 1.12.2.html" target="_blank">Minecraft</a></li>
       <li><a href="sims/Ragdoll Archers.html" target="_blank">Ragdoll Archers</a></li>
    </ul>

    <button onclick="logout()">Logout</button>
  </div>


  <script>
    // USERS LIST (add more users here)
    const users = [
      { username: "kaiju", password: "BluG64L", role: "admin" },
      { username: "kayden", password: "example", role: "friend" }
    ];

    function login() {
      const username = document.getElementById("usernameInput").value;
      const password = document.getElementById("passwordInput").value;
      const errorMsg = document.getElementById("errorMsg");

      const foundUser = users.find(user => user.username === username && user.password === password);

      if (foundUser) {
        document.getElementById("loginBox").style.display = "none";

        if (foundUser.role === "admin") {
          document.getElementById("adminContent").style.display = "block";
        } else if (foundUser.role === "friend") {
          document.getElementById("friendContent").style.display = "block";
        }

      } else {
        errorMsg.textContent = "Incorrect username or password.";
      }
    }

    function logout() {
      document.getElementById("adminContent").style.display = "none";
      document.getElementById("friendContent").style.display = "none";
      document.getElementById("loginBox").style.display = "block";

      document.getElementById("usernameInput").value = "";
      document.getElementById("passwordInput").value = "";
      document.getElementById("errorMsg").textContent = "";
    }

    // Allow Enter key to submit
    document.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        login();
      }
    });
  </script>

</body>
</html>
