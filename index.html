<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishix | New Windows Style Homepage</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", sans-serif;
}

body{
  height:100vh;
  background:url("https://images.unsplash.com/photo-1503264116251-35a269479413") center/cover no-repeat;
  overflow:hidden;
}

/* Desktop */
.desktop{
  height:100%;
  display:flex;
  flex-wrap:wrap;
  padding:40px;
  gap:30px;
}

/* Desktop Icons */
.icon{
  width:90px;
  text-align:center;
  color:white;
  cursor:pointer;
}

.icon img{
  width:60px;
  height:60px;
  border-radius:15px;
  transition:.2s;
}

.icon:hover img{
  transform:scale(1.1);
}

/* Taskbar */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:60px;
  background:rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Taskbar Icons */
.taskbar .apps{
  display:flex;
  gap:25px;
}

.taskbar img{
  width:35px;
  cursor:pointer;
  transition:.2s;
}

.taskbar img:hover{
  transform:scale(1.2);
}

/* Start Menu */
.start-menu{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  width:350px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(25px);
  border-radius:20px;
  padding:20px;
  display:none;
  color:white;
}

.start-menu h3{
  margin-bottom:15px;
}

.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.tile{
  background:rgba(255,255,255,0.2);
  padding:20px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.tile:hover{
  background:rgba(255,255,255,0.35);
}
</style>
</head>

<body>

<div class="desktop">
  <div class="icon" onclick="alert('Opening My Computer')">
    <img src="https://img.icons8.com/fluency/96/folder-invoices.png">
    <div>My Files</div>
  </div>

  <div class="icon" onclick="alert('Opening Browser')">
    <img src="https://img.icons8.com/color/96/internet.png">
    <div>Browser</div>
  </div>

  <div class="icon" onclick="alert('Opening Settings')">
    <img src="https://img.icons8.com/color/96/settings.png">
    <div>Settings</div>
  </div>
</div>

<div class="start-menu" id="startMenu">
  <h3>Pinned</h3>
  <div>
  <div class="md-col-4">
    <a href="simulators.html">Sims</a>
<a href="meet the devs.html">Meet The Developers</a>
<a href="sims.html">Developer Login Portal</a>
  </div>
</div>

<div class="taskbar">
  <div class="apps">
    <img src="https://img.icons8.com/fluency/48/windows-11.png" onclick="toggleStart()">
    <img src="https://img.icons8.com/color/48/microsoft-edge-new.png">
    <img src="https://img.icons8.com/color/48/folder-invoices.png">
    <img src="https://img.icons8.com/color/48/microsoft-store.png">
  </div>
</div>

<script>
function toggleStart(){
  let menu = document.getElementById("startMenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}
</script>

</body>
</html>
