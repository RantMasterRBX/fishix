<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 8 Interactive Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#1ba1e2;overflow:hidden}

.start-screen{
  position:absolute;
  inset:0;
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  grid-auto-rows:150px;
  gap:15px;
  overflow:auto;
}

.header{color:white;font-size:42px;font-weight:300;grid-column:1/-1}

.tile{
  background:#0078d7;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  transition:.2s;
}
.tile:hover{transform:scale(1.05);opacity:.9}
.wide{grid-column:span 2}
.green{background:#00a300}
.orange{background:#fa6800}
.purple{background:#aa00ff}
.teal{background:#00aba9}

.app-window{
  position:absolute;
  inset:0;
  background:white;
  display:none;
  flex-direction:column;
}

.app-header{
  background:#0078d7;
  color:white;
  padding:15px;
  font-size:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.app-content{flex:1;padding:20px;overflow:auto}

button{
  padding:8px 12px;
  border:none;
  background:#0078d7;
  color:white;
  cursor:pointer;
}
button:hover{opacity:.8}

input,textarea{
  width:100%;
  padding:8px;
  margin:5px 0 10px;
}

/* Charms Bar */
.charms{
  position:fixed;
  top:0;
  right:-260px;
  width:260px;
  height:100%;
  background:#111;
  color:white;
  transition:.3s;
  padding-top:60px;
}

.charm-item{
  padding:20px;
  cursor:pointer;
  border-bottom:1px solid #333;
}

.charm-item:hover{background:#222}

.charms.open{right:0}

.corner-trigger{
  position:fixed;
  top:0;
  right:0;
  width:20px;
  height:100%;
}

.settings-panel{
  position:absolute;
  inset:0;
  background:#f2f2f2;
  display:none;
  padding:30px;
}

</style>
</head>
<body>

<div class="start-screen" id="start">
  <div class="header">Start</div>
  <div class="tile" onclick="openApp('mail')">Mail</div>
  <div class="tile green" onclick="openApp('notes')">Notes</div>
  <div class="tile orange wide" onclick="openApp('browser')">Browser</div>
  <div class="tile purple" onclick="openApp('calculator')">Calculator</div>
  <div class="tile teal" onclick="openApp('weather')">Weather</div>
</div>

<!-- Apps -->
<div class="app-window" id="mail">
  <div class="app-header">Mail <button onclick="closeApp()">Close</button></div>
  <div class="app-content">
    <h3>Compose Email</h3>
    <input placeholder="To">
    <input placeholder="Subject">
    <textarea rows="6" placeholder="Message"></textarea>
    <button onclick="alert('Email Sent (demo)')">Send</button>
  </div>
</div>

<div class="app-window" id="notes">
  <div class="app-header">Notes <button onclick="closeApp()">Close</button></div>
  <div class="app-content">
    <h3>Simple Notes</h3>
    <textarea rows="10" id="noteArea" placeholder="Write notes..."></textarea>
    <button onclick="saveNote()">Save</button>
  </div>
</div>

<div class="app-window" id="browser">
  <div class="app-header">Fake Browser <button onclick="closeApp()">Close</button></div>
  <div class="app-content">
    <input id="fakeUrl" placeholder="Enter URL...">
    <button onclick="loadFakePage()">Go</button>
    <div id="browserContent" style="margin-top:20px"></div>
  </div>
</div>

<div class="app-window" id="calculator">
  <div class="app-header">Calculator <button onclick="closeApp()">Close</button></div>
  <div class="app-content">
    <input id="calcInput" placeholder="e.g. 5+5">
    <button onclick="calculate()">=</button>
    <h3 id="calcResult"></h3>
  </div>
</div>

<div class="app-window" id="weather">
  <div class="app-header">Weather <button onclick="closeApp()">Close</button></div>
  <div class="app-content">
    <h3>Current Weather</h3>
    <p>Sunny ☀️</p>
    <p>72°F</p>
  </div>
</div>

<!-- Charms Bar -->
<div class="corner-trigger" onmouseenter="openCharms()"></div>

<div class="charms" id="charmsBar">
  <div class="charm-item" onclick="alert('Search clicked (demo)')">Search</div>
  <div class="charm-item" onclick="goStart()">Start</div>
  <div class="charm-item" onclick="alert('Share clicked (demo)')">Share</div>
  <div class="charm-item" onclick="openSettings()">Settings</div>
</div>

<div class="settings-panel" id="settingsPanel">
  <h2>Settings</h2>
  <button onclick="toggleTheme()">Toggle Dark Mode</button>
  <button onclick="closeSettings()">Close</button>
</div>

<script>
function openApp(id){
  document.getElementById('start').style.display='none';
  document.querySelectorAll('.app-window').forEach(a=>a.style.display='none');
  document.getElementById(id).style.display='flex';
}

function closeApp(){
  document.querySelectorAll('.app-window').forEach(a=>a.style.display='none');
  document.getElementById('start').style.display='grid';
}

function calculate(){
  try{
    let result=eval(document.getElementById('calcInput').value);
    document.getElementById('calcResult').innerText=result;
  }catch{document.getElementById('calcResult').innerText='Error'}
}

function loadFakePage(){
  let url=document.getElementById('fakeUrl').value;
  document.getElementById('browserContent').innerHTML=
    '<h3>Loaded: '+url+'</h3><p>This is a simulated webpage.</p>';
}

function saveNote(){
  localStorage.setItem('demoNote',document.getElementById('noteArea').value);
  alert('Note saved!');
}

window.onload=function(){
  if(localStorage.getItem('demoNote'))
    document.getElementById('noteArea').value=localStorage.getItem('demoNote');
}

function openCharms(){
  document.getElementById('charmsBar').classList.add('open');
}

document.body.addEventListener('mousemove',function(e){
  if(e.clientX < window.innerWidth-50)
    document.getElementById('charmsBar').classList.remove('open');
});

function goStart(){
  closeApp();
}

function openSettings(){
  document.getElementById('settingsPanel').style.display='block';
}

function closeSettings(){
  document.getElementById('settingsPanel').style.display='none';
}

function toggleTheme(){
  if(document.body.style.background==='black'){
    document.body.style.background='#1ba1e2';
  }else{
    document.body.style.background='black';
  }
}
</script>

</body>
</html>
